<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mental Math">
<title>Mental Math Drill</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#ffffff; --tint:#f5f7fc; --tint2:#eef2fa;
  --ink:#0c1a3a; --ink2:#2a3756; --muted:#5f6b85; --rule:#e1e6f0; --rule2:#edf0f6;
  --blue:#1f4fe0; --blue-d:#1638b8; --blue-s:#eef3ff; --blue-m:#d4dfff;
  --good:#0b7a4b; --good-s:#e8f6ef; --bad:#c42b20; --bad-s:#fdeeec; --amber:#9a5b00; --amber-s:#fff5e3;
  --key:#f1f4fb; --key-p:#dfe6f7;
  --shadow:0 1px 2px rgba(12,26,58,.05), 0 2px 8px rgba(12,26,58,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
.wrap{max-width:540px;margin:0 auto;padding:14px 16px 40px}
.hidden{display:none!important}

/* header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 2px 12px}
.stamp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:700}
h1{font-family:Archivo,sans-serif;font-weight:700;font-size:25px;margin:3px 0 0;letter-spacing:-.015em}
h2{font-family:Archivo,sans-serif;font-weight:700;font-size:18px;margin:22px 0 8px;letter-spacing:-.01em}
.mark{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:#fff;font:700 15px Archivo,sans-serif;flex:none}

/* tabs */
.tabs{display:flex;gap:3px;background:var(--tint);border:1px solid var(--rule2);border-radius:12px;padding:3px;margin-bottom:16px}
.tab{flex:1;border:0;background:none;border-radius:9px;padding:8px 0;font:600 14px "Source Sans 3",sans-serif;color:var(--muted);cursor:pointer}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(12,26,58,.12)}

/* generic */
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 7px;display:flex;justify-content:space-between;align-items:center}
.lbl .link{font-size:12px;letter-spacing:0;text-transform:none}
.fine{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
.card{border:1px solid var(--rule);border-radius:14px;padding:14px;background:#fff;box-shadow:var(--shadow)}
.link{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;padding:0;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:700 16px "Source Sans 3",sans-serif;padding:13px 16px;cursor:pointer;text-align:center}
.btn:active{background:var(--blue-d)}
.btn.cta{display:flex;width:100%;margin-top:22px;padding:15px;font-size:17px}
.btn.sec{background:#fff;color:var(--blue);border:1.5px solid var(--blue-m)}
.btn.sec:active{background:var(--blue-s)}
.btn.ghost{background:none;color:var(--muted);font-weight:600}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* setup */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{text-align:left;border:1.5px solid var(--rule);background:#fff;border-radius:14px;padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:76px}
.mcard b{font:700 16px Archivo,sans-serif}
.mcard span{font-size:13px;color:var(--muted);line-height:1.3}
.mcard.on{border-color:var(--blue);background:var(--blue-s)}
.mcard.on b{color:var(--blue-d)}
.seg{display:flex;background:var(--tint);border:1px solid var(--rule2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:9px 2px;font:600 14px "Source Sans 3",sans-serif;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(12,26,58,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--rule);background:#fff;border-radius:999px;padding:7px 12px;font:600 13.5px "Source Sans 3",sans-serif;color:var(--ink2);cursor:pointer}
.chip.on{border-color:var(--blue);background:var(--blue-s);color:var(--blue-d)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;padding:12px 14px;border:1px solid var(--rule);border-radius:14px}
.toggle b{font-weight:700}
.toggle .fine{margin-top:2px}
.switch{width:46px;height:28px;border-radius:14px;background:var(--rule);position:relative;border:0;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch.on{background:var(--blue)}
.switch.on::after{left:21px}
table.tol{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}
table.tol th,table.tol td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--rule2);font-variant-numeric:tabular-nums}
table.tol th:first-child,table.tol td:first-child{text-align:left}
table.tol th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.tol tr.on td{color:var(--blue-d);font-weight:700;background:var(--blue-s)}
.review{display:flex;justify-content:space-between;align-items:center;gap:12px;border-color:var(--blue-m);background:var(--blue-s);box-shadow:none;margin-bottom:4px}
.rv-n{font:700 17px Archivo,sans-serif;margin-top:2px}

/* drill */
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:30px}
.barl{font-size:14px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.barl b{font:700 22px Archivo,sans-serif;color:var(--ink);margin-right:6px}
.barl b.low{color:var(--bad)}
.progress{height:4px;background:var(--rule2);border-radius:2px;margin:8px 0 16px;overflow:hidden}
.progress>div{height:100%;background:var(--blue);width:0;transition:width .2s linear}
.progress.warn>div{background:var(--bad)}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pill{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--tint);border:1px solid var(--rule2);border-radius:999px;padding:2px 8px}
.pill.blue{color:var(--blue-d);background:var(--blue-s);border-color:var(--blue-m)}
.pill.good{color:var(--good);background:var(--good-s);border-color:#cfe9dc}
.pill.bad{color:var(--bad);background:var(--bad-s);border-color:#f4d3cf}
.pill.amber{color:var(--amber);background:var(--amber-s);border-color:#f2dfbf}
.prompt{font:700 28px/1.18 Archivo,sans-serif;letter-spacing:-.015em}
.prompt.long{font-size:21px}
.sub{color:var(--muted);font-size:16px;margin-top:5px}
.hints{margin-top:10px}
.hints:empty{display:none}
.hint{background:var(--amber-s);border:1px solid #f2dfbf;border-radius:10px;padding:8px 11px;font-size:14.5px;margin-top:6px;color:#5c3a00}
.hint b{font-weight:700;color:var(--amber)}
.answer{margin-top:14px;border:1.5px solid var(--rule);border-radius:14px;padding:10px 14px;display:flex;align-items:baseline;gap:6px;min-height:66px;background:#fff;box-shadow:var(--shadow);transition:border-color .12s,background .12s}
.answer.active{border-color:var(--blue)}
.answer .val{font:700 32px Archivo,sans-serif;flex:1;letter-spacing:-.01em;word-break:break-all;font-variant-numeric:tabular-nums}
.answer .val.ph{color:#c3cbdb}
.answer .pre,.answer .unit{font:600 22px Archivo,sans-serif;color:var(--muted)}
.answer.ok{border-color:var(--good);background:var(--good-s)}
.answer.no{border-color:var(--bad);background:var(--bad-s)}
.verdict{font-weight:700;font-size:14.5px;margin-top:7px;min-height:21px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.tools{display:flex;gap:8px;margin-top:10px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;user-select:none;-webkit-user-select:none}
.pad button{border:0;border-radius:12px;background:var(--key);font:600 24px "Source Sans 3",sans-serif;height:58px;cursor:pointer;touch-action:manipulation;color:var(--ink)}
.pad button:active{background:var(--key-p)}
.pad .fn{font-size:16px;color:var(--ink2)}
.pad .go{grid-column:span 2;background:var(--blue);color:#fff;font-size:19px;font-weight:700}
.pad .go:active{background:var(--blue-d)}
.talk{margin-top:12px;border:1.5px dashed var(--blue-m);border-radius:14px;padding:14px;background:var(--blue-s)}
.talk p{margin:0 0 10px;font-size:15px;color:var(--ink2)}

/* case panel */
.case{border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin-bottom:14px;background:var(--tint)}
.case h3{font:700 16px Archivo,sans-serif;margin:3px 0 8px}
.kv{display:grid;grid-template-columns:1fr auto 1fr auto;gap:3px 10px;font-size:13.5px}
.kv.one{grid-template-columns:1fr auto}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.known{margin-top:8px;border-top:1px solid var(--rule);padding-top:8px}

/* solution */
details.sol{margin-top:12px;border:1px solid var(--rule);border-radius:14px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
details.sol>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font:700 15px Archivo,sans-serif;color:var(--blue-d)}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
details.sol[open]>summary::after{transform:rotate(225deg);margin-top:4px}
.solb{padding:0 14px 14px}
.soltop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.soltop div{background:var(--tint);border-radius:10px;padding:8px 10px}
.soltop span{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.soltop b{font:700 18px Archivo,sans-serif;font-variant-numeric:tabular-nums}
.soltop small{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:4px 0 0}
ol.steps li{counter-increment:s;position:relative;padding:5px 0 5px 32px;font-size:15.5px;line-height:1.4;font-variant-numeric:tabular-nums}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:22px;height:22px;border-radius:50%;background:var(--blue-s);color:var(--blue-d);font:700 12px/22px "Source Sans 3",sans-serif;text-align:center}
.solb p{margin:4px 0 0;font-size:15px;color:var(--ink2)}
.remember{margin-top:12px;background:var(--blue-s);border-left:3px solid var(--blue);border-radius:4px 10px 10px 4px;padding:9px 12px;font-size:15px;font-weight:600;color:var(--ink)}
.remember .lbl{margin:0 0 3px;color:var(--blue-d)}
.diag{margin-top:12px;background:var(--bad-s);border-radius:10px;padding:9px 12px;font-size:14.5px;color:#7a1a13}
.diag b{color:var(--bad)}
.gnote{margin-top:10px;font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .btn{flex:1}
.actions .btn.flex2{flex:1.6}

/* summary / progress */
.big{font:700 44px Archivo,sans-serif;letter-spacing:-.02em;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpis.four{grid-template-columns:repeat(2,1fr)}
.kpis div{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;background:#fff}
.kpis b{display:block;font:700 22px Archivo,sans-serif;font-variant-numeric:tabular-nums}
.kpis span{font-size:12.5px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--rule2);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--rule)}
.diagbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--rule2);margin-top:8px}
.diagbar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.c-concept{background:#c42b20}.c-accuracy{background:#e0a020}.c-speed{background:#1f4fe0}
details.miss{border-bottom:1px solid var(--rule2)}
details.miss>summary{list-style:none;cursor:pointer;padding:10px 0}
details.miss>summary::-webkit-details-marker{display:none}
details.miss .p{font-weight:700;font-size:15px}
details.miss .m{font-size:13.5px;color:var(--muted);margin-top:2px}
details.miss details.sol{margin:0 0 12px}
.rec{margin-top:10px;font-size:15px;color:var(--ink2)}
.spark{width:100%;height:64px;display:block;margin-top:6px}

/* library */
details.skill{border:1px solid var(--rule);border-radius:12px;margin-top:8px;background:#fff}
details.skill>summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:15px}
details.skill>summary::-webkit-details-marker{display:none}
details.skill[open]>summary{border-bottom:1px solid var(--rule2)}
.skb{padding:4px 13px 13px}
.skb .ex{margin-top:10px;background:var(--tint);border-radius:10px;padding:10px 12px}
.skb .ex .q{font:700 17px Archivo,sans-serif}
.skb .stat{font-size:13px;color:var(--muted);margin-top:8px}

/* anchors */
.fracgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 12px;font-size:14.5px;font-variant-numeric:tabular-nums}
.fracgrid div{display:flex;justify-content:space-between;border-bottom:1px solid var(--rule2);padding:5px 0}
.fracgrid span:first-child{color:var(--muted)}
.qbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
ul.rules{padding-left:18px;margin:6px 0 0}
ul.rules li{margin:6px 0;font-size:15px}

body.focus header{display:none}

/* installed-app tweaks */
html,body{overscroll-behavior:none;touch-action:manipulation}
.wrap{padding-top:max(14px, env(safe-area-inset-top));padding-bottom:max(40px, calc(env(safe-area-inset-bottom) + 24px));padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right))}
button{-webkit-user-select:none;user-select:none}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="stamp">PE / IB interview math</div><h1>Mental Math Drill</h1></div>
    <div class="mark" aria-hidden="true">%</div>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-act="tab" data-v="train">Train</button>
    <button class="tab" data-act="tab" data-v="lib">Shortcuts</button>
    <button class="tab" data-act="tab" data-v="anchors">Anchors</button>
    <button class="tab" data-act="tab" data-v="progress">Progress</button>
  </nav>

  <section id="v-setup"></section>

  <section id="v-drill" class="hidden">
    <div class="topbar"><div class="barl" id="dBar"></div><button class="link" data-act="endSession">End session</button></div>
    <div class="progress" id="dProgWrap"><div id="dProg"></div></div>
    <div id="dCase" class="case hidden"></div>
    <div class="qmeta"><span class="stamp" id="dCat"></span><span class="pill" id="dDiff"></span></div>
    <div class="prompt" id="dPrompt"></div>
    <div class="sub" id="dSub"></div>
    <div class="hints" id="dHints"></div>
    <div class="answer active" id="dAns"><span class="pre" id="dPre"></span><span class="val ph" id="dVal">0</span><span class="unit" id="dUnit"></span></div>
    <div class="verdict" id="dVerdict"></div>
    <div id="dPadWrap">
      <div class="tools" id="dTools"></div>
      <div class="talk hidden" id="dTalk">
        <p><b>Talk it through.</b> Say your approach out loud: what's the first number you need, and what shortcut gets you there? Then answer. The clock is running.</p>
        <button class="btn sm" data-act="talkDone">I have my answer</button>
      </div>
      <div class="pad" id="pad">
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="del" class="fn" aria-label="Delete">⌫</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="neg" class="fn" aria-label="Plus or minus">±</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="skip" class="fn">Skip</button>
        <button data-k="0">0</button><button data-k=".">.</button><button data-k="go" class="go">Check</button>
      </div>
    </div>
    <div id="dAfter" class="hidden"></div>
  </section>

  <section id="v-summary" class="hidden"></section>
  <section id="v-debrief" class="hidden"></section>
  <section id="v-lib" class="hidden"></section>
  <section id="v-anchors" class="hidden"></section>
  <section id="v-progress" class="hidden"></section>
</div>

<script>
"use strict";
/* =========================================================================
   ENGINE — question generators and the fastest-method solver.
   Every answer is computed from the numbers; every method step is built
   from the same numbers, so the explanation always matches the question.
   ========================================================================= */
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; };
const rnd = (x, dp = 2) => { const f = Math.pow(10, dp); return Math.round(x * f) / f; };
function fmt(n, dp = 2) {
  if (n === null || n === undefined || !isFinite(n)) return "—";
  const v = rnd(n, dp);
  const s = Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: dp, minimumFractionDigits: 0 });
  return (v < 0 ? "−" : "") + s;
}
const F = (n, dp = 3) => fmt(n, dp);
const M = (n, dp = 1) => (n < 0 ? "−$" : "$") + fmt(Math.abs(n), dp) + "M";
const X = (n, dp = 2) => fmt(n, dp) + "x";
const only25 = d => { while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1; };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const pts = x => `${F(x, 2)} pt${Math.abs(rnd(x, 3)) === 1 ? "" : "s"}`;
const fx2 = n => n.toFixed(2);
const prettyFrac = x => { const a = Math.abs(x); if (Math.abs(a - 1 / 3) < 1e-6) return "⅓"; if (Math.abs(a - 2 / 3) < 1e-6) return "⅔"; return F(a, 3); };

const CATS = {
  pct: "% of a number", frac: "Fractions → %", div: "Multiples & division", growth: "Growth & margins",
  comp: "Compounding", ret: "MOIC ↔ IRR", bridge: "EV ↔ equity bridge", lbo: "Paper LBO steps", recall: "Anchor recall"
};

/* ---------- tolerance ---------- */
const TOL = {
  exact:     { pp: 0.1, rel: 0.005, bps: 1,  label: "Exact" },
  tight:     { pp: 0.5, rel: 0.02,  bps: 5,  label: "Tight" },
  interview: { pp: 1.0, rel: 0.05,  bps: 10, label: "Interview" }
};
const TOL_ORDER = ["exact", "tight", "interview"];
function errOf(q, given) { return q.tol === "rel" ? Math.abs(given - q.answer) / Math.max(Math.abs(q.answer), q.floor || 0) : Math.abs(given - q.answer); }
function within(q, given, level) { return errOf(q, given) <= TOL[level][q.tol] + 1e-9; }
function effLevel(q, level) {
  if (!q.minTol) return level;
  return TOL_ORDER.indexOf(q.minTol) > TOL_ORDER.indexOf(level) ? q.minTol : level;
}
function grade(q, given, level) {
  const L = effLevel(q, level);

function nearRound(base, p) {
  const step = base < 1000 ? 100 : 500;
  const R = Math.round(base / step) * step;

      remember: "Simple growth + kicker: n·r + [n(n−1)/2]·r². Reliable while n·r is under ~40%; beyond that it understates.",
      hints: ["Start with simple growth, then add growth-on-growth.", `${r}% × ${n} years = ${lin}% simple.`, `Kicker: ${pairs} × (${r}%)².`] };

/* ---------- session ---------- */

  const mins = kind === "sprint" ? settings.sLen : (Date.now() - S.startTs) / 60000;
  const cpm = kind === "sprint" ? ok / settings.sLen : null;
  if (S.counted && n) { ST.sessions.push({ ts: Date.now(), kind, n, ok, avg, cpm }); if (ST.sessions.length > 80) ST.sessions.shift(); saveStats(); }
  const b = bucketsOf(log);
  let h = `<div class="stamp">${S.label} · session complete</div><div class="big">${ok} / ${n}</div>`;
  h += `<div class="kpis ${kind === "sprint" ? "four" : ""}"><div><b>${n ? Math.round(ok / n * 100) : 0}%</b><span>Accuracy</span></div><div><b>${fmt(avg, 1)}s</b><span>Avg response</span></div>` +
    (kind === "sprint" ? `<div><b>${fmt(cpm, 1)}</b><span>Correct / minute</span></div><div><b>${n}</b><span>Attempted</span></div>` : `<div><b>${n}</b><span>Questions</span></div>`) + `</div>`;
  h += `<h2>What held you back</h2>${diagBar(b)}<p class="rec">${diagnose(b)}</p>`;
  const by = {};
  log.forEach(r => { const x = by[r.q.cat] || (by[r.q.cat] = { n: 0, ok: 0, t: 0, par: 0 }); x.n++; if (r.ok) x.ok++; x.t += r.secs; x.par += parFor(r.q); });
  h += `<h2>By type</h2><table class="t"><tr><th>Type</th><th>Score</th><th>Avg time</th><th>Par</th></tr>` + Object.entries(by).map(([c, x]) => `<tr><td>${CATS[c]}</td><td>${x.ok}/${x.n}</td><td>${fmt(x.t / x.n, 1)}s</td><td>${fmt(x.par / x.n, 0)}s</td></tr>`).join("") + `</table>`;
  const miss = log.filter(r => !r.ok);
  h += `<h2>Mistakes${miss.length ? ` (${miss.length})` : ""}</h2>`;
  h += miss.length ? `<div class="fine" style="margin-top:-4px">Untimed review. Tap one to see the fastest method.</div>` + miss.map(r => `<details class="miss"><summary><div class="p">${r.q.prompt}</div><div class="m">${r.q.sub ? r.q.sub + " · " : ""}you: ${r.given === null ? (r.how === "timeout" ? "time" : "skipped") : ansText(r.q, r.given)} · answer: ${ansText(r.q)}${r.cls.label ? " · " + r.cls.label : ""}</div></summary><details class="sol" open><summary>Fastest solution</summary>${solHTML(r.q, r)}</details></details>`).join("") : `<p class="rec">None.</p>`;
  S.lastMisses = miss.map(r => r.q);
  h += `<div class="actions" style="flex-wrap:wrap">` + (miss.length && kind !== "retry" ? `<button class="btn" style="flex-basis:100%" data-act="retryMissed">Retry the ${plural(miss.length, "miss").replace("misss", "misses")} untimed</button>` : "") +
    `<button class="btn sec" data-act="toSetup">Settings</button><button class="btn flex2" data-act="again">Go again</button></div>`;
  $("v-summary").innerHTML = h;
  S.done = true; S.lastKind = kind;
  show("summary");
}

/* ---------- library ---------- */
function skillStatus(id) {
  const s = ST.skill[id];
  if (!s || !s.n) return ST.seen[id] ? ["Seen", "blue"] : ["New", ""];
  const acc = s.ok / s.n, avg = s.tn ? s.t / s.tn : 99;
  if (s.n >= 10 && acc >= 0.9 && avg <= SK[id].par[1]) return ["Mastered", "good"];
  if (s.n < 5) return ["Learning", "blue"];
  if (acc >= 0.75) return ["Solid", "good"];
  return ["Needs work", "bad"];
}
let libFilter = "all";
function renderLib() {
  let h = `<div class="fine" style="margin-top:0">Every shortcut the drill teaches. Open one for the rule, why it works and a live example. Learn it untimed, or test yourself with five scored questions.</div>`;
  h += `<div class="seg" style="margin-top:12px">${[["all", "All"], ["seen", "Seen"], ["work", "Needs work"]].map(([k, l]) => `<button class="${libFilter === k ? "on" : ""}" data-act="libFilter" data-v="${k}">${l}</button>`).join("")}</div>`;
  for (const cat of Object.keys(CATS)) {
    const ids = Object.keys(SK).filter(id => SK[id].cat === cat).filter(id => {
      const [st] = skillStatus(id);
      return libFilter === "all" || (libFilter === "seen" && st !== "New") || (libFilter === "work" && (st === "Needs work" || st === "Learning"));
    });
    if (!ids.length) continue;
    h += `<h2>${CATS[cat]}</h2>`;
    h += ids.map(id => {
      const [st, cl] = skillStatus(id), s = ST.skill[id];
      const stat = s && s.n ? `${s.n} scored attempts · ${Math.round(s.ok / s.n * 100)}% accurate · ${fmt(s.tn ? s.t / s.tn : 0, 1)}s average (par ${SK[id].par[1]}s at Intermediate)` : "No scored attempts yet.";
      return `<details class="skill" data-skill="${id}"><summary><span>${SK[id].name}</span><span class="pill ${cl}">${st}</span></summary><div class="skb" id="skb-${id.replace(".", "-")}"><div class="stat">${stat}</div></div></details>`;
    }).join("");
  }
  $("v-lib").innerHTML = h;
  document.querySelectorAll("details.skill").forEach(d => d.addEventListener("toggle", () => { if (d.open && !d.dataset.loaded) { d.dataset.loaded = 1; fillSkill(d.dataset.skill); } }));
}
function fillSkill(id) {
  const el = $("skb-" + id.replace(".", "-")), q = genQ(SK[id].gen, 1, id), s = ST.skill[id];
  const top = s && s.labels ? Object.entries(s.labels).sort((a, b) => b[1] - a[1])[0] : null;
  el.innerHTML = `<div class="remember" style="margin-top:8px"><div class="lbl">Remember this</div>${q.remember}</div><div class="lbl">Why it works</div><p style="margin:0;font-size:15px;color:var(--ink2)">${q.why}</p>
  <div class="ex" id="ex-${id.replace(".", "-")}">${exHTML(q)}</div>
  ${top ? `<div class="diag">Most common error here: <b>${top[0]}</b> (${top[1]}×)</div>` : ""}
  <div class="stat">${el.querySelector(".stat").innerHTML}</div>
  <div class="actions"><button class="btn sec sm" data-act="newEx" data-v="${id}">New example</button><button class="btn sec sm" data-act="learnSkill" data-v="${id}">Learn</button><button class="btn sm" data-act="testSkill" data-v="${id}">Test me · 5</button></div>`;
}
const exHTML = q => `<div class="lbl" style="margin-top:0">Example</div><div class="q">${q.prompt}</div><div class="fine" style="margin-top:2px">${q.sub || ""} → <b style="color:var(--ink)">${ansText(q)}</b></div><ol class="steps">${q.steps.map(s => `<li>${s}</li>`).join("")}</ol>`;

/* ---------- anchors ---------- */
function renderAnchors() {
  const fr = [];
  for (const d of [2, 3, 4, 5, 6, 7, 8, 9, 11, 12, 16]) for (let n = 1; n < d; n++) if (gcd(n, d) === 1) fr.push(`<div><span>${n}/${d}</span><span>${fmt(n / d * 100, 2)}%</span></div>`);
  const yrs = [3, 4, 5, 6, 7], mo = [1.25, 1.5, 2, 2.5, 3, 4, 5];
  const irrT = `<table class="t"><tr><th>MOIC</th>${yrs.map(y => `<th>${y} yrs</th>`).join("")}</tr>` + mo.map(m => `<tr><td>${m}x</td>${yrs.map(y => `<td>${((Math.pow(m, 1 / y) - 1) * 100).toFixed(1)}%</td>`).join("")}</tr>`).join("") + `</table>`;
  const ns = [3, 5, 7];
  const compT = `<table class="t"><tr><th>Rate</th>${ns.map(n => `<th>${n} yrs</th>`).join("")}</tr>` + COMP_R.map(r => `<tr><td>${r}%</td>${ns.map(n => `<td>${Math.pow(1 + r / 100, n).toFixed(2)}x</td>`).join("")}</tr>`).join("") + `</table>`;
  $("v-anchors").innerHTML = `<div class="fine" style="margin-top:0">Know these cold and most interview math becomes "anchor, then adjust." Every figure is computed live from the formula.</div>
  <div class="card" style="margin-top:12px"><div class="stamp">Quiz yourself</div><div class="fine" style="margin-top:2px">Untimed recall with the answer after each one. Not scored.</div>
  <div class="qbtns"><button class="btn sec sm" data-act="quiz" data-v="rcFrac">Fractions</button><button class="btn sec sm" data-act="quiz" data-v="rcIrr">MOIC → IRR</button><button class="btn sec sm" data-act="quiz" data-v="rcComp">Compounding</button><button class="btn sm" data-act="quiz" data-v="all">All three</button></div></div>
  <h2>Highest-value anchors</h2><ul class="rules">
  <li><b>2x</b> ≈ ${irrA(2, 3)}% over 3 years, ${irrA(2, 5)}% over 5. <b>3x</b> ≈ ${irrA(3, 3)}% over 3, ${irrA(3, 5)}% over 5.</li>
  <li><b>(1.10)^5</b> ≈ ${fx2(compAnchor(10, 5))}x · <b>(1.15)^5</b> ≈ ${fx2(compAnchor(15, 5))}x · <b>(1.20)^5</b> ≈ ${fx2(compAnchor(20, 5))}x</li>
  <li><b>Eighths</b> step by 12.5%. <b>Sixteenths</b> step by 6.25%. <b>1/7</b> ≈ 14.29%, <b>1/9</b> ≈ 11.11%, <b>1/12</b> ≈ 8.33%.</li>
  <li><b>100 bps</b> of margin = 1% of revenue in EBITDA.</li></ul>
  <h2>Fractions → %</h2><div class="fracgrid">${fr.join("")}</div>
  <h2>MOIC → IRR</h2><div class="fine" style="margin-top:-4px">IRR = MOIC^(1/years) − 1. Assumes one cash flow in and one out, with no interim dividends.</div>${irrT}
  <h2>Compounding factor (1 + r)^n</h2>${compT}
  <h2>Rules of thumb (approximations)</h2><ul class="rules">
  <li><b>Rule of 72:</b> doubling time ≈ 72 ÷ rate. Best between about 6% and 12%; at 25% it gives 2.9 years vs ${fmt(Math.log(2) / Math.log(1.25), 1)} exact.</li>
  <li><b>Rule of 115:</b> tripling time ≈ 115 ÷ rate. <b>Rule of 144:</b> quadrupling ≈ 144 ÷ rate.</li>
  <li><b>Two-term compounding:</b> (1 + r)^n ≈ 1 + n·r + [n(n−1)/2]·r². Good while n·r is under ~40%; beyond that it understates.</li>
  <li><b>Flip trick:</b> x% of y = y% of x. 16% of 25 = 25% of 16 = 4.</li>
  <li><b>Interpolating IRR:</b> a straight line between two anchors slightly understates the true IRR.</li></ul>`;
}

/* ---------- progress ---------- */
function spark(vals, max, suffix) {
  if (vals.length < 2) return `<div class="fine">Needs at least two sessions.</div>`;
  const W = 320, H = 64, p = 6, mx = max || Math.max(...vals) || 1;
  const pts = vals.map((v, i) => [p + i * (W - 2 * p) / (vals.length - 1), H - p - v / mx * (H - 2 * p)]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="#1f4fe0" stroke-width="2" points="${pts.map(x => x.join(",")).join(" ")}"/>${pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.5" fill="#1f4fe0"/>`).join("")}</svg><div class="fine">Last ${vals.length}: ${vals.map(v => fmt(v, 1) + suffix).slice(-5).join(" → ")}</div>`;
}
let resetArm = false;
function renderProgress() {
  const cats = Object.keys(CATS), tot = cats.reduce((a, c) => a + (ST.cat[c] ? ST.cat[c].n : 0), 0);
  const ok = cats.reduce((a, c) => a + (ST.cat[c] ? ST.cat[c].ok : 0), 0);
  const tsum = cats.reduce((a, c) => a + (ST.cat[c] ? ST.cat[c].t : 0), 0), tn = cats.reduce((a, c) => a + (ST.cat[c] ? ST.cat[c].tn : 0), 0);
  const b = emptyB(); cats.forEach(c => { if (ST.cat[c] && ST.cat[c].b) for (const k in b) b[k] += ST.cat[c].b[k]; });
  let h = `<div class="fine" style="margin-top:0">Scored attempts from Practice, Sprint, Interview and Review, saved on this device. Learn mode is never counted.</div>`;
  h += `<div class="kpis"><div><b>${tot}</b><span>Answered</span></div><div><b>${tot ? Math.round(ok / tot * 100) : 0}%</b><span>Accuracy</span></div><div><b>${tn ? fmt(tsum / tn, 1) : "—"}s</b><span>Avg time</span></div></div>`;
  h += `<h2>What's holding you back</h2>${diagBar(b)}<p class="rec">${diagnose(b)}</p>`;
  h += `<h2>By category</h2><table class="t"><tr><th>Type</th><th>Tries</th><th>Acc.</th><th>Avg</th><th>Main issue</th></tr>` + cats.map(c => {
    const s = ST.cat[c];
    if (!s || !s.n) return `<tr><td>${CATS[c]}${settings.diff === "auto" ? ` <span class="pill">L${(ST.levels[c] && ST.levels[c].lv) || 1}</span>` : ""}</td><td>0</td><td>—</td><td>—</td><td>—</td></tr>`;
    const top = Object.entries(s.b || emptyB()).sort((x, y) => y[1] - x[1])[0];
    return `<tr><td>${CATS[c]}${settings.diff === "auto" ? ` <span class="pill">L${(ST.levels[c] && ST.levels[c].lv) || 1}</span>` : ""}</td><td>${s.n}</td><td>${Math.round(s.ok / s.n * 100)}%</td><td>${s.tn ? fmt(s.t / s.tn, 1) + "s" : "—"}</td><td>${top && top[1] ? top[0][0].toUpperCase() + top[0].slice(1) : "—"}</td></tr>`;
  }).join("") + `</table>`;
  const errs = [];
  const GENERIC = ["Method broke down", "Close: arithmetic slip", "Skipped: no approach", "Ran out of time"];
  for (const [id, s] of Object.entries(ST.skill)) for (const [l, n] of Object.entries(s.labels || {})) if (!GENERIC.includes(l)) errs.push([l, n, id]);
  errs.sort((a, c) => c[1] - a[1]);
  h += `<h2>Most common errors</h2>` + (errs.length ? `<table class="t"><tr><th>Error</th><th>Shortcut</th><th>×</th></tr>` + errs.slice(0, 6).map(([l, n, id]) => `<tr><td>${l}</td><td><button class="link" data-act="learnSkill" data-v="${id}">${SK[id] ? SK[id].name : id}</button></td><td>${n}</td></tr>`).join("") + `</table>` : `<div class="fine">No named errors yet. These are specific traps, like dividing growth by the ending value or forgetting to subtract debt. General misses show up in the bar above.</div>`);
  const ses = ST.sessions.slice(-20);
  h += `<h2>Accuracy by session</h2>` + spark(ses.map(s => s.n ? s.ok / s.n * 100 : 0), 100, "%");
  const sp = ST.sessions.filter(s => s.kind === "sprint").slice(-20);
  if (sp.length) h += `<h2>Sprint pace (correct / minute)</h2>` + spark(sp.map(s => s.cpm || 0), 0, "");
  const due = dueItems().length;
  h += `<h2>Review queue</h2><div class="fine" style="margin-top:-4px">${plural(REV.length, "question")} in the queue · ${due} due now. A correct review pushes the next one out (1 → 3 → 7 → 21 days); a miss brings it back within hours.</div>` + (due ? `<button class="btn sec sm" style="margin-top:8px" data-act="startReview">Review ${due} now</button>` : "");
  h += `<button class="btn ghost" style="margin-top:20px;width:100%" data-act="reset">${resetArm ? "Tap again to erase all progress" : "Reset progress"}</button>`;
  $("v-progress").innerHTML = h;
}

/* ---------- actions ---------- */
const ACT = {
  tab: el => { if (S && !S.done && el.dataset.v === "train") return show("drill"); show({ train: "setup", lib: "lib", anchors: "anchors", progress: "progress" }[el.dataset.v]); },
  set: el => { const k = el.dataset.k, v = el.dataset.v; settings[k] = ["pLen", "sLen", "iCases", "iTimer"].includes(k) ? +v : v; saveSettings(); renderSetup(); },
  toggle: el => { settings[el.dataset.k] = !settings[el.dataset.k]; saveSettings(); renderSetup(); },
  chip: el => { const k = el.dataset.k, v = el.dataset.v; settings[k] = settings[k].includes(v) ? settings[k].filter(x => x !== v) : settings[k].concat(v); saveSettings(); renderSetup(); },
  allCats: () => { settings.cats = Object.keys(CATS); saveSettings(); renderSetup(); },
  noCats: () => { settings.cats = []; saveSettings(); renderSetup(); },
  start: () => start(settings.mode),
  startReview: () => { const items = dueItems().slice(0, 20); if (items.length) start("review", { presets: items, label: "Review" }); },
  endSession: () => { if (!S) return show("setup"); if (S.kind === "interview" && !$("v-debrief").classList.contains("hidden")) return finish(); finish(); },
  hint: () => {
    if (S.hints >= S.q.hints.length) return;
    S.hints++;
    $("dHints").innerHTML = S.q.hints.slice(0, S.hints).map((x, i) => `<div class="hint"><b>Hint ${i + 1}.</b> ${x}</div>`).join("");
    const b = $("hintBtn"); if (S.hints >= S.q.hints.length) { b.textContent = "No more hints"; b.disabled = true; } else b.textContent = `Hint ${S.hints + 1} of ${S.q.hints.length}`;
  },
  reveal: () => submit("skip"),
  talkDone: () => talkDone(),
  next: () => primaryNext(),
  similar: () => { const q = similar(S.q); if (S.presets) S.presets.unshift(q); else S.override = q; nextQ(); },
  flag: el => { if (S.flagged) return; S.flagged = true; const it = addReview(S.q); el.textContent = it ? "★ Flagged" : "★ Queued"; el.disabled = true; },
  nextCase: () => { S.iv.ci++; S.iv.si = 0; show("drill"); nextQ(); },
  retryMissed: () => { const m = S.lastMisses || []; if (m.length) start("retry", { presets: m, label: "Retry" }); },
  again: () => { const k = S && S.lastKind; start(k === "retry" || k === "review" ? settings.mode : (k || settings.mode), S && S.focus ? { focus: S.focus, total: S.total } : {}); },
  toSetup: () => { S = null; show("setup"); },
  libFilter: el => { libFilter = el.dataset.v; renderLib(); },
  newEx: el => { const id = el.dataset.v; $("ex-" + id.replace(".", "-")).innerHTML = exHTML(genQ(SK[id].gen, rand(1, 2), id)); },
  learnSkill: el => start("learn", { focus: { skill: el.dataset.v }, label: "Learn" }),
  testSkill: el => start("practice", { focus: { skill: el.dataset.v }, total: 5, label: "Skill test" }),
  quiz: el => start("learn", { focus: { gens: el.dataset.v === "all" ? ["rcFrac", "rcIrr", "rcComp"] : [el.dataset.v] }, label: "Anchor quiz" }),
  reset: () => {
    if (!resetArm) { resetArm = true; renderProgress(); setTimeout(() => { resetArm = false; if (!$("v-progress").classList.contains("hidden")) renderProgress(); }, 3000); return; }
    ST = { cat: {}, skill: {}, sessions: [], levels: {}, seen: {} }; REV = []; saveStats(); saveRev(); resetArm = false; renderProgress();
  }
};
document.addEventListener("click", e => {
  const k = e.target.closest("#pad button");
  if (k) { press(k.dataset.k); return; }
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act]) { e.preventDefault(); ACT[a.dataset.act](a); }
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!S || $("v-drill").classList.contains("hidden")) return;
  let k = null;
  if (/^\d$/.test(e.key)) k = e.key;
  else if (e.key === ".") k = ".";
  else if (e.key === "-") k = "neg";
  else if (e.key === "Backspace") k = "del";
  else if (e.key === "Enter") k = "go";
  else if (e.key === "Escape") k = "skip";
  else if ((e.key === "h" || e.key === "H") && S.kind === "learn" && !S.answered) { e.preventDefault(); ACT.hint(); return; }
  if (k) { e.preventDefault(); press(k); }
});
show("setup");

if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }

</script>
</body>
